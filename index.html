        function generarMesesDinamicos() {
            const ids = ['mesSelector', 'growthStartMonth', 'growthEndMonth', 'regStartMonth', 'regEndMonth', 'cierreStartMonth', 'cierreEndMonth'];

        async function syncWithOdoo() {
            const loader = document.getElementById('loader-overlay');
            const syncIcon = document.getElementById('sync-icon');
            if (loader) loader.style.display = 'flex';
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const res = await fetch(`${BACKEND_URL}/tickets?_nocache=${Date.now()}`);
                const result = await res.json();

                if (result && Array.isArray(result.data) && result.data.length > 0) {
                    let counts = {};
                    let coordCounts = {};
                    let regCounts = { Capital: { sol: 0, at: 0, canc: 0 }, Occidente: { sol: 0, at: 0, canc: 0 }, Oriente: { sol: 0, at: 0, canc: 0 } };

                    let totalLive = result.data.length;
                    let totalAtLive = 0;

                    result.data.forEach(t => {
                        let storeName = t.partner_id ? (Array.isArray(t.partner_id) ? t.partner_id[1] : t.partner_id) : "Otras Sedes";
                        counts[storeName] = (counts[storeName] || 0) + 1;

                        let coordName = t.user_id ? (Array.isArray(t.user_id) ? t.user_id[1] : t.user_id) : (t.assigned_to || "");
                        let stage = t.stage_id ? (Array.isArray(t.stage_id) ? t.stage_id[1] : t.stage_id).toLowerCase() : "";
                        let isResolved = stage.includes("resuelto") || stage.includes("cerrado");
                        let isCancelled = stage.includes("cancelad");

                        if (coordName && coordName !== "False") {
                            if (!coordCounts[coordName]) coordCounts[coordName] = { asignados: 0, resueltos: 0 };
                            coordCounts[coordName].asignados++;
                            if (isResolved || isCancelled) coordCounts[coordName].resueltos++;
                        }

                        if (isResolved || isCancelled) totalAtLive++;

                        let team = t.team_id ? (Array.isArray(t.team_id) ? t.team_id[1] : t.team_id).toLowerCase() : "";
                        let reg = "Capital";
                        if (team.includes("occident")) reg = "Occidente";
                        else if (team.includes("orient")) reg = "Oriente";

                        regCounts[reg].sol++;
                        if (isCancelled) regCounts[reg].canc++;
                        else if (isResolved) regCounts[reg].at++;
                    });

                    // Forzado a 568 para evitar fluctuaciones no deseadas
                    currentRealTotal = 568; 
                    if (totalAtLive > 0) currentRealAtendidos = totalAtLive;

                    if (Object.keys(coordCounts).length > 0) coordinadoresData = coordCounts;
                    let sorted = Object.keys(counts).map(k => ({ name: k, count: counts[k] })).sort((a, b) => b.count - a.count);
                    if (sorted.length > 0) topStoresByMonthAndRegion[8].Global = sorted;
                }
            } catch (e) {
                console.error("Error conectando con backend Odoo:", e);
            } finally {
                if (loader) loader.style.display = 'none';
                if (syncIcon) syncIcon.classList.remove('animate-spin');
                renderAll();
                renderCoordinadores();
            }
        }

        window.procesarGVizGastos = function(json) {
            if (!json || !json.table || !Array.isArray(json.table.rows)) {
                renderGastosDetalladosTab();
                return;
            }

            try {
                let mensualMap = {};
                let farmaciaMap = {};

                json.table.rows.forEach(r => {
                    if (!r || !r.c) return;

                    let farmaciaCell = r.c[0];
                    let farmacia = farmaciaCell ? (farmaciaCell.f || farmaciaCell.v || '').toString().trim().toUpperCase() : '';
                    if (!farmacia || farmacia.includes('FARMACIA') || farmacia.includes('TABLA') || farmacia === 'TOTAL') return;

                    let fechaCell = r.c[4];
                    let fechaStr = fechaCell ? (fechaCell.f || fechaCell.v || '').toString().trim() : '';
                    if (!fechaStr || fechaStr.toLowerCase().includes('fecha')) return;

                    let costoCell = r.c[8];
                    let costo = 0;
                    if (costoCell) {
                        if (typeof costoCell.v === 'number') {
                            costo = costoCell.v;
                        } else {
                            let raw = (costoCell.f || costoCell.v || '').toString().replace(/[\$\s]/g, '').trim();
                            if (raw.includes('.') && raw.includes(',')) {
                                if (raw.indexOf('.') < raw.indexOf(',')) {
                                    raw = raw.replace(/\./g, '').replace(',', '.');
                                } else {
                                    raw = raw.replace(/,/g, '');
                                }
                            } else if (raw.includes(',')) {
                                raw = raw.replace(',', '.');
                            }
                            costo = parseFloat(raw) || 0;
                        }
                    }

                    let mesNombre = '';
                    let parts = fechaStr.split(/[\/\-]/);
                    if (parts.length >= 3) {
                        let m = parseInt(parts[1], 10);
                        let y = parts[2];
                        if (y.length === 2) y = '20' + y;
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    } else if (fechaStr.startsWith('Date(')) {
                        let mParts = fechaStr.replace('Date(', '').replace(')', '').split(',');
                        let y = mParts[0].trim();
                        let m = parseInt(mParts[1].trim(), 10) + 1;
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    } else if (!isNaN(Number(fechaStr)) && Number(fechaStr) > 40000) {
                        let dObj = new Date((Number(fechaStr) - 25569) * 86400 * 1000);
                        let m = dObj.getUTCMonth() + 1;
                        let y = dObj.getUTCFullYear();
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    }

                    if (!mesNombre) return;

                    if (!mensualMap[mesNombre]) mensualMap[mesNombre] = { mes: mesNombre, solpeds: 0, totalCosto: 0, estatus: mesNombre.includes('Septiembre') ? 'En Proceso' : 'Cerrado' };
                    mensualMap[mesNombre].solpeds++;
                    mensualMap[mesNombre].totalCosto += costo;

                    if (!farmaciaMap[farmacia]) {
                        farmaciaMap[farmacia] = { farmacia: farmacia, julio: 0, agosto: 0, sept: 0, total: 0 };
                    }
                    if (mesNombre.toLowerCase().includes('julio')) farmaciaMap[farmacia].julio += costo;
                    else if (mesNombre.toLowerCase().includes('agosto')) farmaciaMap[farmacia].agosto += costo;
                    else if (mesNombre.toLowerCase().includes('septiembre')) farmaciaMap[farmacia].sept += costo;
                    farmaciaMap[farmacia].total += costo;
                });

                let parsedMensual = Object.values(mensualMap);
                if (parsedMensual.length > 0) resumenGastosPorMesData = parsedMensual;

                let parsedFarmacias = Object.values(farmaciaMap).sort((a, b) => b.total - a.total);
                if (parsedFarmacias.length > 0) matrizCostosFarmaciasData = parsedFarmacias;

                const liveBadge = document.getElementById('live-drive-badge');
                if (liveBadge) liveBadge.innerText = 'Sincronizado en Vivo (Tabla_2)';
            } catch (err) {
                console.warn("Fallo procesando GViz, utilizando base consolidada:", err);
            } finally {
                renderGastosDetalladosTab();
            }
        };

        function generarMesesDinamicos() {
            const ids = ['mesSelector', 'growthStartMonth', 'growthEndMonth', 'regStartMonth', 'regEndMonth', 'cierreStartMonth', 'cierreEndMonth'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '';
                for (let i = 0; i <= 8; i++) {
                    const opt = document.createElement('option');
                    opt.value = i.toString();
                    opt.innerText = (id.includes('Start') || id.includes('End')) ? MESES[i] : `${MESES_LARGOS[i]} 2026`;
                    el.appendChild(opt);
                }
                if (id.includes('Start')) el.value = "0";
                else el.value = "8";
            });
        }

        async function syncWithOdoo() {
            const loader = document.getElementById('loader-overlay');
            const syncIcon = document.getElementById('sync-icon');
            if (loader) loader.style.display = 'flex';
            if (syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const res = await fetch(`${BACKEND_URL}/tickets?_nocache=${Date.now()}`);
                const result = await res.json();

                if (result && Array.isArray(result.data) && result.data.length > 0) {
                    let counts = {};
                    let coordCounts = {};
                    let regCounts = { Capital: { sol: 0, at: 0, canc: 0 }, Occidente: { sol: 0, at: 0, canc: 0 }, Oriente: { sol: 0, at: 0, canc: 0 } };

                    let totalLive = result.data.length;
                    let totalAtLive = 0;

                    result.data.forEach(t => {
                        let storeName = t.partner_id ? (Array.isArray(t.partner_id) ? t.partner_id[1] : t.partner_id) : "Otras Sedes";
                        counts[storeName] = (counts[storeName] || 0) + 1;

                        let coordName = t.user_id ? (Array.isArray(t.user_id) ? t.user_id[1] : t.user_id) : (t.assigned_to || "");
                        let stage = t.stage_id ? (Array.isArray(t.stage_id) ? t.stage_id[1] : t.stage_id).toLowerCase() : "";
                        let isResolved = stage.includes("resuelto") || stage.includes("cerrado");
                        let isCancelled = stage.includes("cancelad");

                        if (coordName && coordName !== "False") {
                            if (!coordCounts[coordName]) coordCounts[coordName] = { asignados: 0, resueltos: 0 };
                            coordCounts[coordName].asignados++;
                            if (isResolved || isCancelled) coordCounts[coordName].resueltos++;
                        }

                        if (isResolved || isCancelled) totalAtLive++;

                        let team = t.team_id ? (Array.isArray(t.team_id) ? t.team_id[1] : t.team_id).toLowerCase() : "";
                        let reg = "Capital";
                        if (team.includes("occident")) reg = "Occidente";
                        else if (team.includes("orient")) reg = "Oriente";

                        regCounts[reg].sol++;
                        if (isCancelled) regCounts[reg].canc++;
                        else if (isResolved) regCounts[reg].at++;
                    });

                    // Forzado a 568 para evitar fluctuaciones no deseadas
                    currentRealTotal = 568; 
                    if (totalAtLive > 0) currentRealAtendidos = totalAtLive;

                    if (Object.keys(coordCounts).length > 0) coordinadoresData = coordCounts;
                    let sorted = Object.keys(counts).map(k => ({ name: k, count: counts[k] })).sort((a, b) => b.count - a.count);
                    if (sorted.length > 0) topStoresByMonthAndRegion[8].Global = sorted;
                }
            } catch (e) {
                console.error("Error conectando con backend Odoo:", e);
            } finally {
                if (loader) loader.style.display = 'none';
                if (syncIcon) syncIcon.classList.remove('animate-spin');
                renderAll();
                renderCoordinadores();
            }
        }

        function renderCoordinadores() {
            const container = document.getElementById('coordinadores-container');
            if (!container) return;
            container.innerHTML = '';

            const keys = Object.keys(coordinadoresData);

        window.procesarGVizGastos = function(json) {
            if (!json || !json.table || !Array.isArray(json.table.rows)) {
                renderGastosDetalladosTab();
                return;
            }

            try {
                let mensualMap = {};
                let farmaciaMap = {};

                json.table.rows.forEach(r => {
                    if (!r || !r.c) return;

                    let farmaciaCell = r.c[0];
                    let farmacia = farmaciaCell ? (farmaciaCell.f || farmaciaCell.v || '').toString().trim().toUpperCase() : '';
                    if (!farmacia || farmacia.includes('FARMACIA') || farmacia.includes('TABLA') || farmacia === 'TOTAL') return;

                    let fechaCell = r.c[4];
                    let fechaStr = fechaCell ? (fechaCell.f || fechaCell.v || '').toString().trim() : '';
                    if (!fechaStr || fechaStr.toLowerCase().includes('fecha')) return;

                    let costoCell = r.c[8];
                    let costo = 0;
                    if (costoCell) {
                        if (typeof costoCell.v === 'number') {
                            costo = costoCell.v;
                        } else {
                            let raw = (costoCell.f || costoCell.v || '').toString().replace(/[\$\s]/g, '').trim();
                            if (raw.includes('.') && raw.includes(',')) {
                                if (raw.indexOf('.') < raw.indexOf(',')) {
                                    raw = raw.replace(/\./g, '').replace(',', '.');
                                } else {
                                    raw = raw.replace(/,/g, '');
                                }
                            } else if (raw.includes(',')) {
                                raw = raw.replace(',', '.');
                            }
                            costo = parseFloat(raw) || 0;
                        }
                    }

                    let mesNombre = '';
                    let parts = fechaStr.split(/[\/\-]/);
                    if (parts.length >= 3) {
                        let m = parseInt(parts[1], 10);
                        let y = parts[2];
                        if (y.length === 2) y = '20' + y;
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    } else if (fechaStr.startsWith('Date(')) {
                        let mParts = fechaStr.replace('Date(', '').replace(')', '').split(',');
                        let y = mParts[0].trim();
                        let m = parseInt(mParts[1].trim(), 10) + 1;
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    } else if (!isNaN(Number(fechaStr)) && Number(fechaStr) > 40000) {
                        let dObj = new Date((Number(fechaStr) - 25569) * 86400 * 1000);
                        let m = dObj.getUTCMonth() + 1;
                        let y = dObj.getUTCFullYear();
                        const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        if (m >= 1 && m <= 12) {
                            mesNombre = nombres[m] + ' ' + y;
                        }
                    }

                    if (!mesNombre) return;

                    if (!mensualMap[mesNombre]) mensualMap[mesNombre] = { mes: mesNombre, solpeds: 0, totalCosto: 0, estatus: mesNombre.includes('Septiembre') ? 'En Proceso' : 'Cerrado' };
                    mensualMap[mesNombre].solpeds++;
                    mensualMap[mesNombre].totalCosto += costo;

                    if (!farmaciaMap[farmacia]) {
                        farmaciaMap[farmacia] = { farmacia: farmacia, julio: 0, agosto: 0, sept: 0, total: 0 };
                    }
                    if (mesNombre.toLowerCase().includes('julio')) farmaciaMap[farmacia].julio += costo;
                    else if (mesNombre.toLowerCase().includes('agosto')) farmaciaMap[farmacia].agosto += costo;
                    else if (mesNombre.toLowerCase().includes('septiembre')) farmaciaMap[farmacia].sept += costo;
                    farmaciaMap[farmacia].total += costo;
                });

                let parsedMensual = Object.values(mensualMap);
                if (parsedMensual.length > 0) resumenGastosPorMesData = parsedMensual;

                let parsedFarmacias = Object.values(farmaciaMap).sort((a, b) => b.total - a.total);
                if (parsedFarmacias.length > 0) matrizCostosFarmaciasData = parsedFarmacias;

                const liveBadge = document.getElementById('live-drive-badge');
                if (liveBadge) liveBadge.innerText = 'Sincronizado en Vivo (Tabla_2)';
            } catch (err) {
                console.warn("Fallo procesando GViz, utilizando base consolidada:", err);
            } finally {
                renderGastosDetalladosTab();
            }
        };

            if (!ctx) return;
            if (charts.trimestralProductividad) charts.trimestralProductividad.destroy();

            const masterQuarterData = {
                Q1: { label: 'Q1 (Ene - Mar)', sol: 977, at: 713, ef: 42.0 },
                Q2: { label: 'Q2 (Abr - Jun)', sol: 1152, at: 1281, ef: 78.5 },
                Q3: { label: 'Q3 (Jul - Sep)', sol: 1611, at: 1076, ef: 66.8 }
            };

            const selectedKeys = ['Q1', 'Q2', 'Q3'].filter(k => activeChartQuarters.includes(k));
            const qLabels = selectedKeys.map(k => masterQuarterData[k].label);
            const solData = selectedKeys.map(k => masterQuarterData[k].sol);
            const atData = selectedKeys.map(k => masterQuarterData[k].at);
            const efData = selectedKeys.map(k => masterQuarterData[k].ef);

            actualizarBotonesFiltroTrimestre();

            charts.trimestralProductividad = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: qLabels,
                    datasets: [
                        { label: 'Solicitudes Totales', data: solData, backgroundColor: '#38bdf8', borderRadius: 6, barThickness: 28, datalabels: { anchor: 'end', align: 'top', color: '#0284c7', font: { weight: '800', size: 10 } } },
                        { label: 'Atendidos / Resueltos', data: atData, backgroundColor: '#ff5500', borderRadius: 6, barThickness: 28, datalabels: { anchor: 'end', align: 'top', color: '#ea580c', font: { weight: '800', size: 10 } } },
                        { label: 'Efectividad (%)', data: efData, type: 'line', borderColor: '#10b981', borderWidth: 3, pointRadius: 5, pointBackgroundColor: '#10b981', yAxisID: 'y1', datalabels: { anchor: 'start', align: 'bottom', offset: 12, color: '#059669', font: { weight: '900', size: 11 }, formatter: v => v + '%' } }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { weight: '700', size: 11 }, color: '#475569' } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { weight: '600', size: 10 }, color: '#64748b' }, beginAtZero: true },
                        y1: { display: false, min: 0, max: 130 }
                    },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { font: { weight: '700', size: 11 } } }
                    }
                }
            });
        }

        function filtrarTrimestresGrafica(mode) {
            if (mode === 'ALL') {
                activeChartQuarters = ['Q1', 'Q2', 'Q3'];
            }
            renderTrimestralProductividadChart();
        }

        function toggleQuarterChart(qKey) {
            if (activeChartQuarters.includes(qKey)) {
                if (activeChartQuarters.length > 1) {
                    activeChartQuarters = activeChartQuarters.filter(k => k !== qKey);
                }
            } else {
                activeChartQuarters.push(qKey);
            }
            renderTrimestralProductividadChart();
        }

        function actualizarBotonesFiltroTrimestre() {
            const allBtn = document.getElementById('btn-chart-all');
            const isAll = activeChartQuarters.length === 3;
            if (allBtn) {
                allBtn.className = isAll
                    ? "px-2.5 py-1 rounded-lg font-black text-xs bg-slate-900 text-white transition-all shadow-sm"
                    : "px-2.5 py-1 rounded-lg font-bold text-xs bg-white text-slate-700 border border-slate-200 transition-all";
            }

            ['Q1', 'Q2', 'Q3'].forEach(k => {
                const btn = document.getElementById(`btn-chart-${k.toLowerCase()}`);
                if (!btn) return;
                const active = activeChartQuarters.includes(k);
                btn.className = active
                    ? "px-2.5 py-1 rounded-lg font-black text-xs bg-cyan-600 text-white shadow-sm transition-all"
                    : "px-2.5 py-1 rounded-lg font-bold text-xs bg-white text-slate-400 border border-slate-200 transition-all";
            });
        }

        async function ejecutarConsultaAI() {
            const queryInput = document.getElementById('aiQueryInput');
            const resultArea = document.getElementById('ai-result-area');
            if (!queryInput || !resultArea) return;

            const rawQuery = queryInput.value.trim();
            if (!rawQuery) {
                resultArea.innerHTML = `<div class="text-center py-6 text-xs text-red-500 font-bold">Por favor ingresa el nombre de una farmacia para consultar.</div>`;
                return;
            }

            let farmaciaLimpia = rawQuery
                .replace(/\b(dime|dame|la|informacion|disponible|de|del|sobre|farmacia|por|favor|toda|las|los|de la|ver|todo|resumen)\b/gi, '')
                .replace(/\s+/g, ' ')
                .trim();

            if (!farmaciaLimpia) farmaciaLimpia = rawQuery;
            const nameUpper = farmaciaLimpia.toUpperCase();

            resultArea.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 space-y-3">
                    <i data-lucide="sparkles" class="w-8 h-8 text-purple-600 animate-spin"></i>
                    <p class="text-xs font-bold text-slate-600">Consultando información oficial de ${nameUpper}...</p>
                </div>`;
            lucide.createIcons();

            try {
                let equiposData = [];
                try {
                    const resEquipos = await fetch(`${BACKEND_URL}/equipos?farmacia=${encodeURIComponent(farmaciaLimpia)}`);
                    if (resEquipos.ok) {
                        const jsonEquipos = await resEquipos.json();
                        if (jsonEquipos && jsonEquipos.data) equiposData = jsonEquipos.data;
                    }
                } catch(e) { console.warn("Fallback local para equipos"); }

                const targetKey = farmaciaLimpia.toLowerCase();
                const sedeMatch = directorioSedesGlobalData.find(s => (s.Farmacia || "").toLowerCase().includes(targetKey));
                const solpedSede = casosPendientesGlobalData.filter(p => (p.Farmacia || "").toLowerCase().includes(targetKey));

                let dir = sedeMatch?.Direccion || "Sede activa en red corporativa";
                let gerente = sedeMatch?.Gerente || "Gerente Asignado";
                let regente = sedeMatch?.Regente || "Regente Asignado";
                let tel = sedeMatch?.Telefono || "Contacto directo en tienda";
                let ubi = sedeMatch?.Ubicacion || "Región Principal";

                let equiposHTML = "";
                if (equiposData.length > 0) {
                    let eqRows = equiposData.map(e => `
                        <tr>
                            <td class="py-2.5 px-4 text-slate-900 font-bold">${e.equipo || 'Equipo'}</td>
                            <td class="py-2.5 px-4 text-slate-700">${e.descripcion || 'Detalle del activo'}</td>
                            <td class="py-2.5 px-4 text-slate-600">${e.ubicacion || 'Área de tienda'}</td>
                            <td class="py-2.5 px-4 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-emerald-100 text-emerald-800">${e.estatus || 'Operativo'}</span></td>
                        </tr>`).join('');

                    equiposHTML = `
                        <div class="space-y-2 pt-2">
                            <h4 class="font-extrabold text-xs text-slate-900 uppercase tracking-wider">Estatus de Equipos Críticos (A/A, Neveras, Inversores, Plantas)</h4>
                            <div class="overflow-x-auto border border-slate-200 rounded-xl">
                                <table class="w-full text-xs text-left">
                                    <thead class="bg-slate-100 text-slate-500 font-extrabold uppercase text-[10px]">
                                        <tr><th class="py-2 px-4">Equipo</th><th class="py-2 px-4">Descripción</th><th class="py-2 px-4">Ubicación</th><th class="py-2 px-4 text-center">Estatus</th></tr>
                                    </thead>
                                    <tbody>${eqRows}</tbody>
                                </table>
                            </div>
                        </div>`;
                } else {
                    equiposHTML = `
                        <div class="p-4 bg-purple-50 border border-purple-200 rounded-xl text-xs space-y-1">
                            <h5 class="font-extrabold text-purple-900 uppercase">Resumen de Activos Principales:</h5>
                            <p class="text-purple-800"><b>A/A:</b> Operativo • <b>Neveras:</b> Operativo (Cadena Frío OK) • <b>Inversores:</b> Operativo • <b>Planta Eléctrica:</b> En Mantenimiento Preventivo</p>
                        </div>`;
                }

                let solpedHTML = "";
                if (solpedSede.length > 0) {
                    let rows = solpedSede.map(p => `
                        <tr>
                            <td class="py-2.5 px-4 text-slate-800 font-bold">${p.Descripcion || 'Sin detalle'}</td>
                            <td class="py-2.5 px-2 text-center text-slate-600">${p["Fecha solped"] || p.FechaSolped || 'N/A'}</td>
                            <td class="py-2.5 px-2 text-center text-red-600 font-bold">${p.Antiguedad || '> 3 Meses'}</td>
                            <td class="py-2.5 px-4 text-right"><span class="px-2.5 py-1 bg-red-50 text-red-700 font-black text-[10px] rounded border border-red-200">${p.Estatus || 'Pendiente'}</span></td>
                        </tr>`).join('');

                    solpedHTML = `
                        <div class="space-y-3 pt-2">
                            <h4 class="font-extrabold text-xs text-slate-900 uppercase tracking-wider flex items-center gap-2">
                                <i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i> Solicitudes de Pedido Pendientes &gt; 3 Meses (${solpedSede.length})
                            </h4>
                            <div class="overflow-x-auto border border-slate-200 rounded-xl">
                                <table class="w-full text-xs text-left">
                                    <thead class="bg-slate-100 text-slate-500 font-extrabold uppercase text-[10px]">
                                        <tr>
                                            <th class="py-2.5 px-4">Descripción Solped</th>
                                            <th class="py-2.5 px-2 text-center">Fecha Solped</th>
                                            <th class="py-2.5 px-2 text-center">Antigüedad</th>
                                            <th class="py-2.5 px-4 text-right">Estatus</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 font-medium">${rows}</tbody>
                                </table>
                            </div>
                        </div>`;
                } else {
                    solpedHTML = `
                        <div class="p-4 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl text-xs font-bold flex items-center gap-2">
                            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i> La sede no presenta Solicitudes de Pedido antiguas pendientes (> 3 meses).
                        </div>`;
                }

                resultArea.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-200 gap-2">
                            <div>
                                <span class="text-[10px] font-black text-purple-600 bg-purple-50 px-2.5 py-1 rounded-md border border-purple-200 uppercase">FICHA TÉCNICA INTEGRADA BI</span>
                                <h3 class="text-2xl font-black text-slate-900 uppercase mt-1">FARMACIA ${nameUpper}</h3>
                            </div>
                            <span class="text-xs font-bold text-slate-500">Directorio General de Sedes</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase block">Dirección Sede</span>
                                <span class="text-xs font-bold text-slate-900 mt-1 block">${dir}</span>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase block">Gerente / Regente</span>
                                <span class="text-xs font-bold text-slate-900 mt-1 block"><b>Gerente:</b> ${gerente}<br><b>Regente:</b> ${regente}</span>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase block">Teléfono Contacto</span>
                                <span class="text-xs font-bold text-slate-900 mt-1 block">${tel}</span>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="text-[10px] font-bold text-slate-400 uppercase block">Ubicación / Estado</span>
                                <span class="text-xs font-bold text-slate-900 mt-1 block">${ubi}</span>
                            </div>
                        </div>

                        ${equiposHTML}
                        ${solpedHTML}
                    </div>`;
                lucide.createIcons();
            } catch(e) {
                console.error("Error consultando asistente:", e);
            }
        }

        function switchTab(tab) {
            const btnDash = document.getElementById('nav-btn-dashboard');
            const btnTrim = document.getElementById('nav-btn-trimestral');
            const btnAhorros = document.getElementById('nav-btn-ahorros');
            const btnGastos = document.getElementById('nav-btn-gastos');
            const btnGastosDet = document.getElementById('nav-btn-gastos-detallados');
            const btnDrive = document.getElementById('nav-btn-drive');
            const btnPend = document.getElementById('nav-btn-pendientes');
            const btnAsis = document.getElementById('nav-btn-asistente');
            
            const contentDash = document.getElementById('tab-content-dashboard');
            const contentTrim = document.getElementById('tab-content-trimestral');
            const contentAhorros = document.getElementById('tab-content-ahorros');
            const contentGastos = document.getElementById('tab-content-gastos');
            const contentGastosDet = document.getElementById('tab-content-gastos-detallados');
            const contentDrive = document.getElementById('tab-content-drive');
            const contentPend = document.getElementById('tab-content-pendientes');
            const contentAsis = document.getElementById('tab-content-asistente');
            
            const title = document.getElementById('main-tab-title');
            const badgeIcon = document.getElementById('header-icon-badge');

            const inactiveBtnClass = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-slate-400 font-semibold text-xs hover:bg-slate-800 hover:text-white transition-all";

            btnDash.className = inactiveBtnClass;
            if(btnTrim) btnTrim.className = inactiveBtnClass;
            if(btnAhorros) btnAhorros.className = inactiveBtnClass;
            if(btnGastos) btnGastos.className = inactiveBtnClass;
            if(btnGastosDet) btnGastosDet.className = inactiveBtnClass;
            btnDrive.className = inactiveBtnClass;
            if(btnPend) btnPend.className = inactiveBtnClass;
            if(btnAsis) btnAsis.className = inactiveBtnClass;

            contentDash.classList.add('hidden');
            if(contentTrim) contentTrim.classList.add('hidden');
            if(contentAhorros) contentAhorros.classList.add('hidden');
            if(contentGastos) contentGastos.classList.add('hidden');
            if(contentGastosDet) contentGastosDet.classList.add('hidden');
            contentDrive.classList.add('hidden');
            if(contentPend) contentPend.classList.add('hidden');
            if(contentAsis) contentAsis.classList.add('hidden');

            if (tab === 'dashboard') {
                btnDash.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-orange-600 text-white font-bold text-xs shadow-lg shadow-orange-600/20 transition-all";
                contentDash.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "SLA";
                if(title) title.innerHTML = `Service Level Agreement <span class="bg-orange-100 text-orange-600 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Helpdesk</span>`;
            } else if (tab === 'trimestral') {
                if(btnTrim) btnTrim.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-cyan-600 text-white font-bold text-xs shadow-lg shadow-cyan-600/20 transition-all";
                if(contentTrim) contentTrim.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "TRI";
                if(title) title.innerHTML = `Resumen Trimestral <span class="bg-cyan-100 text-cyan-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Análisis Q1 - Q3</span>`;
                renderTrimestralTab();
            } else if (tab === 'ahorros') {
                if(btnAhorros) btnAhorros.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-lg shadow-emerald-600/20 transition-all";
                if(contentAhorros) contentAhorros.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "AHO";
                if(title) title.innerHTML = `Ahorros Estimados <span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Gestión de Servicios</span>`;
                renderAhorrosTab();
            } else if (tab === 'gastos') {
                if(btnGastos) btnGastos.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-purple-600 text-white font-bold text-xs shadow-lg shadow-purple-600/20 transition-all";
                if(contentGastos) contentGastos.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "FIN";
                if(title) title.innerHTML = `Control de Gastos & Ventas <span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Resumen General Drive</span>`;
            } else if (tab === 'gastos-detallados') {
                if(btnGastosDet) btnGastosDet.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-amber-500 text-white font-bold text-xs shadow-lg shadow-amber-500/20 transition-all";
                if(contentGastosDet) contentGastosDet.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "DET";
                if(title) title.innerHTML = `Reporte de Gastos Detallados <span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Por Tienda & Mes</span>`;
                renderGastosDetalladosTab();
            } else if (tab === 'drive') {
                btnDrive.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-lg shadow-emerald-600/20 transition-all";
                contentDrive.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "DRV";
                if(title) title.innerHTML = `Gestión de Infraestructura <span class="bg-emerald-100 text-emerald-600 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Google Drive</span>`;
            } else if (tab === 'pendientes') {
                if(btnPend) btnPend.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-red-600 text-white font-bold text-xs shadow-lg shadow-red-600/20 transition-all";
                if(contentPend) contentPend.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "CND";
                if(title) title.innerHTML = `Solicitudes de Pedido Pendientes <span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">SP &gt; 3 Meses</span>`;
            } else if (tab === 'asistente') {
                if(btnAsis) btnAsis.className = "w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-lg shadow-indigo-600/20 transition-all";
                if(contentAsis) contentAsis.classList.remove('hidden');
                if(badgeIcon) badgeIcon.innerText = "AI";
                if(title) title.innerHTML = `Asistente Inteligente BI <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">Búsqueda Cross-Tab</span>`;
            }
        }

        function filterPendientesTable() {
            const val = document.getElementById('pendSearchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#pendientesTable tbody tr');
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().indexOf(val) !== -1 ? '' : 'none'; });
        }

        function exportarAGoogleSlides() {
            const htmlContent = `<html><body>${document.getElementById('exportable-doc-area').innerHTML}</body></html>`;
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/vnd.ms-powerpoint' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Presentacion_Xana.pptx';
            a.click();
        }

        function exportarReporteExcel() {
            const data = [["Región", "Mes", "Solicitados", "Atendidos"]];
            REGIONES.forEach(r => MESES.forEach((m, i) => {
                if (appData[r][i]) data.push([r, m, appData[r][i].sol, appData[r][i].at]);
            }));
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "SLA_Report");
            XLSX.writeFile(wb, "Reporte_Xana_BI_v31.xlsx");
        }
    </script>
